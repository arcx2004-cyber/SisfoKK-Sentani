server {
    listen 80;
    server_name localhost skkksentani.web.id www.skkksentani.web.id;
    return 301 https://skkksentani.web.id$request_uri;
}

server {
    listen 443 ssl;
    server_name skkksentani.web.id www.skkksentani.web.id;

    ssl_certificate /etc/letsencrypt/live/skkksentani.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skkksentani.web.id/privkey.pem;

    root /var/www/backend/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # === BACKEND & API ===
    location ~ ^/(api|admin|sanctum|livewire|filament|storage) {
        try_files $uri $uri/ /index.php?$query_string;
        
        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # === STATIC ASSETS (LEGACY/BACKEND) ===
    location /css {
        root /var/www/backend/public;
        try_files $uri =404;
    }

    location /js {
        root /var/www/backend/public;
        try_files $uri =404;
    }

    location /images {
        root /var/www/backend/public;
        try_files $uri =404;
    }

    location /fonts {
        root /var/www/backend/public;
        try_files $uri =404;
    }

    # === FRONTEND PROXY (ASTRO SSR) ===
    location / {
        proxy_pass http://sisfokk_node:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
